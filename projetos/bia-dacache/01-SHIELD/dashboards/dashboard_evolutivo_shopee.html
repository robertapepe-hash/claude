const COLS = ['d1','faixa','faixa_ord','mes','shp','meli','merc','shp_lm','meli_lm','merc_lm','shp_ly','meli_ly','merc_ly'];
const DATA = RAW.map(r=>{const o={}; COLS.forEach((c,i)=>{o[c]= (i<2||i===3)? r[i] : Number(r[i]);}); return o;});

const D1S = [...new Set(DATA.map(d=>d.d1))];
const FAIXAS = [...new Map(DATA.map(d=>[d.faixa, d.faixa_ord])).entries()].sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
const MESES = [...new Set(DATA.map(d=>d.mes))].sort();

const sel = { d1:new Set(D1S), faixa:new Set(FAIXAS), from:MESES[0], to:MESES[MESES.length-1] };

function fmtMi(v){ return (v==null||isNaN(v))?'–': v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtPct(v){ return (v==null||isNaN(v)||!isFinite(v))?'–': v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function pctClass(v){ return v>0?'pos':(v<0?'neg':''); }

// Plugin inline: escreve o Ratio (Shopee/MELI) dentro da barra da Shopee (dataset 0)
const ratioLabelPlugin = {
  id:'ratioLabel',
  afterDatasetsDraw(chart){
    const ctx=chart.ctx; const meta=chart.getDatasetMeta(0); if(!meta) return;
    ctx.save(); ctx.font='bold 10px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    meta.data.forEach((bar,i)=>{
      const r=(window.__ratios||[])[i]; if(r==null||isNaN(r)||!isFinite(r)) return;
      ctx.save(); ctx.translate(bar.x, (bar.y+bar.base)/2); ctx.rotate(-Math.PI/2);
      ctx.fillText(Math.round(r)+'%',0,0); ctx.restore();
    });
    ctx.restore();
  }
};

function buildChips(elId, items, set){
  const el=document.getElementById(elId); el.innerHTML='';
  items.forEach(it=>{
    const c=document.createElement('span'); c.className='chip'+(set.has(it)?' on':''); c.textContent=it;
    c.onclick=()=>{ if(set.has(it)){ if(set.size>1) set.delete(it);} else set.add(it); buildChips(elId,items,set); render(); };
    el.appendChild(c);
  });
}
function buildMonthSelectors(){
  const mf=document.getElementById('mFrom'), mt=document.getElementById('mTo');
  mf.innerHTML=''; mt.innerHTML='';
  MESES.forEach(m=>{ mf.add(new Option(m,m)); mt.add(new Option(m,m)); });
  mf.value=sel.from; mt.value=sel.to;
  mf.onchange=()=>{ sel.from=mf.value; if(sel.from>sel.to){sel.to=sel.from; mt.value=sel.to;} render(); };
  mt.onchange=()=>{ sel.to=mt.value; if(sel.to<sel.from){sel.from=sel.to; mf.value=sel.from;} render(); };
}

function aggregate(){
  const months = MESES.filter(m=>m>=sel.from && m<=sel.to);
  const byM = new Map(months.map(m=>[m,{mes:m,shp:0,meli:0,merc:0,shp_lm:0,meli_lm:0,merc_lm:0,shp_ly:0,meli_ly:0,merc_ly:0}]));
  DATA.forEach(d=>{
    if(!sel.d1.has(d.d1)||!sel.faixa.has(d.faixa)||!byM.has(d.mes)) return;
    const o=byM.get(d.mes);
    o.shp+=d.shp; o.meli+=d.meli; o.merc+=d.merc;
    o.shp_lm+=d.shp_lm; o.meli_lm+=d.meli_lm; o.merc_lm+=d.merc_lm;
    o.shp_ly+=d.shp_ly; o.meli_ly+=d.meli_ly; o.merc_ly+=d.merc_ly;
  });
  return months.map(m=>{
    const o=byM.get(m);
    o.ms_shp = o.merc? o.shp/o.merc*100 : null;
    o.ms_meli = o.merc? o.meli/o.merc*100 : null;
    o.ratio = o.meli? o.shp/o.meli*100 : null;
    o.mom_shp = o.shp_lm? (o.shp/o.shp_lm-1)*100 : null;
    o.mom_meli = o.meli_lm? (o.meli/o.meli_lm-1)*100 : null;
    o.yoy_shp = o.shp_ly? (o.shp/o.shp_ly-1)*100 : null;
    o.yoy_meli = o.meli_ly? (o.meli/o.meli_ly-1)*100 : null;
    return o;
  });
}

let chart;
function render(){
  const agg = aggregate();
  const labels = agg.map(o=>o.mes);
  document.getElementById('periodInfo').textContent = agg.length+' meses selecionados';

  const last = agg[agg.length-1] || {};
  const kpis=[
    ['Shopee — '+(last.mes||''), fmtMi(last.shp)+' Mi', 'YoY '+fmtPct(last.yoy_shp), pctClass(last.yoy_shp)],
    ['MELI — '+(last.mes||''), fmtMi(last.meli)+' Mi', 'YoY '+fmtPct(last.yoy_meli), pctClass(last.yoy_meli)],
    ['Ratio Shopee/MELI', fmtPct(last.ratio), 'quanto do nosso tamanho', ''],
    ['MS Shopee', fmtPct(last.ms_shp), 'vs MS MELI '+fmtPct(last.ms_meli), '']
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k=>`<div class="kpi"><div class="lab">${k[0]}</div><div class="val">${k[1]}</div><div class="delta ${k[3]}">${k[2]}</div></div>`).join('');

  window.__ratios = agg.map(o=>o.ratio);
  const ds=[
    {type:'bar', label:'GMV Shopee', data:agg.map(o=>o.shp), backgroundColor:'#EE4D2D', yAxisID:'y', order:2},
    {type:'bar', label:'GMV MELI', data:agg.map(o=>o.meli), backgroundColor:'#FFE600', borderColor:'#c9b800', borderWidth:1, yAxisID:'y', order:2},
    {type:'line', label:'YoY Shopee', data:agg.map(o=>o.yoy_shp), borderColor:'#B93815', backgroundColor:'#B93815', yAxisID:'y1', tension:.25, order:1},
    {type:'line', label:'YoY MELI', data:agg.map(o=>o.yoy_meli), borderColor:'#8A6D00', backgroundColor:'#8A6D00', borderDash:[5,4], yAxisID:'y1', tension:.25, order:1}
  ];
  const cfg={ type:'bar', data:{labels,datasets:ds},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'top'},
        tooltip:{ callbacks:{ label:(c)=>{ const o=agg[c.dataIndex];
          if(c.dataset.label==='GMV Shopee') return ' Shopee: R$ '+fmtMi(o.shp)+' Mi  (ratio '+fmtPct(o.ratio)+')';
          if(c.dataset.label==='GMV MELI') return ' MELI: R$ '+fmtMi(o.meli)+' Mi';
          if(c.dataset.label==='YoY Shopee') return ' YoY Shopee: '+fmtPct(o.yoy_shp);
          return ' YoY MELI: '+fmtPct(o.yoy_meli); } } } },
      scales:{ y:{ title:{display:true,text:'GMV (R$ Mi)'}, beginAtZero:true },
        y1:{ position:'right', title:{display:true,text:'YoY (%)'}, grid:{drawOnChartArea:false}, ticks:{callback:v=>v+'%'} } } },
    plugins:[ratioLabelPlugin] };
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('chart'), cfg);

  const rows=[
    ['MS Shopee', agg.map(o=>fmtPct(o.ms_shp)), null],
    ['MS MELI', agg.map(o=>fmtPct(o.ms_meli)), null],
    ['Ratio (SHP/MELI)', agg.map(o=>fmtPct(o.ratio)), 'ratio'],
    ['MoM Shopee', agg.map(o=>`<span class="${pctClass(o.mom_shp)}">${fmtPct(o.mom_shp)}</span>`), null],
    ['MoM MELI', agg.map(o=>`<span class="${pctClass(o.mom_meli)}">${fmtPct(o.mom_meli)}</span>`), null]
  ];
  let html='<thead><tr><th>Métrica</th>'+labels.map(m=>`<th>${m}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{ html+=`<tr class="${r[2]||''}"><td>${r[0]}</td>`+r[1].map(v=>`<td>${v}</td>`).join('')+'</tr>'; });
  html+='</tbody>';
  document.getElementById('tbl').innerHTML=html;
}

buildChips('fD1', D1S, sel.d1);
buildChips('fFaixa', FAIXAS, sel.faixa);
buildMonthSelectors();
render();
</script>
